    "batch_size",
    "buffer_size",
    "learning_rate",
    "hidden_units",
    "num_layers",
    "beta",
    "epsilon",
    "num_epoch",
]
log_features = [
    "batch_size",
    "buffer_size",
    "learning_rate",
    "beta",
]
group_by = [
    "batch_size",
    "buffer_size",
    "learning_rate",
    "hidden_units",
    "num_layers",
    "beta",
    "epsilon",
    "num_epoch",
]

